<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Pair your iPhone · Trackypady</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./config.js" defer></script>
  <script src="./pair.js" defer></script>
</head>
<body>
  <main>
    <p class="brand">Trackypady</p>
    <h1>Pair with<br>your Mac.</h1>
    <p>Open Trackypady to pair with the Mac you scanned.</p>
    <a id="open-app" class="button" hidden>Open Trackypady</a>
    <a id="download" class="button secondary" hidden rel="noreferrer">Download with TestFlight</a>
    <p id="status" role="status">Checking your pairing link…</p>
    <p class="help">After installing, scan the QR on your Mac again to pair.</p>
    <noscript>Enable JavaScript to open the pairing link, or scan the Mac QR inside Trackypady.</noscript>
    <p class="help"><a href="../">Set up Trackypady Bridge on your Mac</a></p>
    <footer><a href="/trackypady/">Mac setup</a> · <a href="/trackypady/support/">Help</a> · <a href="/trackypady/privacy/">Privacy</a></footer>
  </main>

</html>
